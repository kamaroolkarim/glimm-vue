name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'
      - 'glimm-vue@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Bump version and tag (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -w packages/glimm-vue --no-git-tag-version
          NEW_V=$(node -p "require('./packages/glimm-vue/package.json').version")
          git add -A
          git commit -m "chore(release): v${NEW_V} [skip ci]"
          git tag "v${NEW_V}"
          git push origin HEAD:main "v${NEW_V}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Include README in package
        run: cp README.md packages/glimm-vue/README.md
      - run: npm publish -w packages/glimm-vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: echo "Published glimm-vue@$(node -p "require('./packages/glimm-vue/package.json').version")" >> $GITHUB_STEP_SUMMARY
